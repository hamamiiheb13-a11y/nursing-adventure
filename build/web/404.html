<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="/">
  <script>
    // Configuration dynamique du base-href pour supporter Cloudflare Pages (/), GitHub Pages (/nursing-adventure/) et serveurs locaux
    (function () {
      var baseEl = document.querySelector('base');
      if (!baseEl) {
        baseEl = document.createElement('base');
        document.head.prepend(baseEl);
      }
      var pathname = window.location.pathname;
      if (pathname.indexOf('/nursing-adventure') === 0) {
        baseEl.setAttribute('href', '/nursing-adventure/');
      } else {
        baseEl.setAttribute('href', '/');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="GASTRO QUEST — Expédition médicale 2D arcade dans le système digestif. Pilotez la capsule et maîtrisez les 27 questions cliniques sur les MICI • ISSIT PFE">
  <meta name="theme-color" content="#0E4170">

  <!-- Open Graph / Partage Réseaux -->
  <meta property="og:title" content="GASTRO QUEST — Expédition Digestive 2D Arcade">
  <meta property="og:description" content="Expédition médicale 2D arcade dans le système digestif. Neutralisez les pathogènes et maîtrisez les 27 questions cliniques sur les MICI.">
  <meta property="og:type" content="website">

  <!-- Polices Google Fonts pour affichage instantané -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- iOS PWA tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Capsule Warriors">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GASTRO QUEST — Expédition Digestive 2D Arcade</title>
  <link rel="manifest" href="manifest.json">

  <!-- Synthétiseur Web Audio dynamique intégré -->
  <script src="audio_synth.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0E4170;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 25%, rgba(45, 212, 191, 0.30) 0%, transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(56, 189, 248, 0.25) 0%, transparent 48%),
        linear-gradient(135deg, #0E4170 0%, #165B94 50%, #1A7BA6 100%);
      color: #FFFFFF;
      z-index: 99999;
      transition: opacity 0.45s ease, transform 0.45s ease;
      overflow: hidden;
      padding: 16px;
    }
    .bio-orb {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(56, 189, 248, 0.32);
      background: radial-gradient(circle at 30% 30%, rgba(110, 231, 183, 0.22), transparent 70%);
      animation: floatBubble 6s ease-in-out infinite;
      pointer-events: none;
    }
    .bio-orb.o1 { width: 90px; height: 90px; left: 12%; top: 18%; animation-delay: 0s; }
    .bio-orb.o2 { width: 130px; height: 130px; right: 10%; bottom: 16%; animation-delay: -2s; }
    .bio-orb.o3 { width: 56px; height: 56px; right: 24%; top: 20%; animation-delay: -4s; }
    .loading-card {
      position: relative;
      background: linear-gradient(155deg, rgba(22, 91, 148, 0.90), rgba(30, 111, 168, 0.86));
      border: 1.5px solid rgba(94, 234, 212, 0.55);
      border-radius: 24px;
      padding: 28px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 18px 42px rgba(14, 65, 112, 0.35), 0 0 28px rgba(34, 211, 238, 0.22);
      max-width: 400px;
      width: 92%;
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .capsule-stage {
      width: 140px;
      height: 74px;
      border-radius: 38px;
      background: linear-gradient(90deg, rgba(14, 165, 233, 0.16), rgba(20, 184, 166, 0.22));
      border: 1px solid rgba(125, 211, 252, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .capsule-svg {
      width: 64px;
      height: 44px;
      animation: glideCapsule 2.2s ease-in-out infinite;
    }
    .loading-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.6px;
      color: #FBBF24;
      background: rgba(251, 191, 36, 0.14);
      border: 1px solid rgba(251, 191, 36, 0.4);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .loading-title {
      font-family: 'Orbitron', 'Inter', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2.2px;
      background: linear-gradient(90deg, #FFFFFF 0%, #22D3EE 55%, #A78BFA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .loading-subtitle {
      font-size: 11.5px;
      letter-spacing: 1.8px;
      color: #5EEAD4;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(11, 37, 60, 0.85);
      border: 1px solid rgba(125, 211, 252, 0.3);
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%;
      width: 24%;
      border-radius: 999px;
      background: linear-gradient(90deg, #14B8A6, #22D3EE, #FBBF24);
      animation: fillProgress 3.2s ease-out forwards;
    }
    .loading-status {
      font-size: 11.5px;
      color: #CBD5E1;
      letter-spacing: 0.4px;
      min-height: 16px;
    }
    .fallback-btn {
      display: none;
      margin-top: 14px;
      background: linear-gradient(135deg, #22D3EE, #0EA5E9);
      color: #0B253C;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }
    @keyframes glideCapsule {
      0%, 100% { transform: translate(-4px, 2px) rotate(-2deg); }
      50% { transform: translate(6px, -3px) rotate(2deg); }
    }
    @keyframes floatBubble {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-16px) scale(1.06); }
    }
    @keyframes fillProgress {
      0% { width: 12%; }
      50% { width: 62%; }
      100% { width: 92%; }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="bio-orb o1"></div>
    <div class="bio-orb o2"></div>
    <div class="bio-orb o3"></div>
    <div class="loading-card">
      <div class="loading-badge">ISSIT PFE • EXPÉDITION 2D ARCADE</div>
      <div class="capsule-stage">
        <svg class="capsule-svg" viewBox="0 0 80 50" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="capHull" x1="18" y1="10" x2="66" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FFFFFF"/>
              <stop offset="0.55" stop-color="#22D3EE"/>
              <stop offset="1" stop-color="#0EA5E9"/>
            </linearGradient>
          </defs>
          <path d="M2 25 L16 17 L16 33 Z" fill="#FBBF24" opacity="0.85"/>
          <rect x="16" y="11" width="50" height="28" rx="14" fill="url(#capHull)" stroke="#7DD3FC" stroke-width="2"/>
          <path d="M40 11 V39" stroke="#0F766E" stroke-width="3"/>
          <ellipse cx="52" cy="25" rx="7" ry="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
          <circle cx="53" cy="22" r="2" fill="#FFFFFF"/>
        </svg>
      </div>
      <div class="loading-title">GASTRO QUEST</div>
      <div class="loading-subtitle">CAPSULE WARRIORS • MISSION DIGESTIVE</div>
      <div class="progress-track"><div class="progress-fill" id="loading-bar"></div></div>
      <div class="loading-status" id="loading-status">Calibrage de la capsule médicale...</div>
      <button class="fallback-btn" id="loading-fallback" onclick="location.reload(true);">Actualiser</button>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const bar = document.getElementById('loading-bar');
      if (bar) bar.style.width = '100%';
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.transform = 'scale(1.03)';
        setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 420);
      }
    });

    setTimeout(function () {
      const status = document.getElementById('loading-status');
      const fallback = document.getElementById('loading-fallback');
      if (status) status.innerText = 'Finalisation de l\'environnement digestif...';
      if (fallback) fallback.style.display = 'inline-block';
    }, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
