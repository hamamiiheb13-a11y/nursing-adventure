<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="/nursing-adventure/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Gastro Quest : Urgence MICI - Le jeu éducatif médical de référence pour les étudiants en gastro-entérologie">
  <meta name="theme-color" content="#F6F8FB">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="GASTRO QUEST : URGENCE MICI">
  <meta property="og:description" content="Prenez votre garde : 6 patients à stabiliser et 30 décisions cliniques de référence sur les MICI.">
  <meta property="og:type" content="website">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gastro Quest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GASTRO QUEST : URGENCE MICI</title>
  <link rel="manifest" href="manifest.json">

  <!-- Web Audio Synthesizer -->
  <script src="audio_synth.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F6F8FB;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F6F8FB;
      color: #0F172A;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .loading-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 24px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      max-width: 320px;
      width: 88%;
      text-align: center;
    }
    .logo-badge {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: #CCFBF1;
      border: 1.5px solid #99F6E4;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .medical-icon {
      font-size: 34px;
      line-height: 1;
      color: #0D9488;
    }
    .loading-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #0F172A;
      margin-bottom: 4px;
    }
    .loading-subtitle {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 1.2px;
      color: #0D9488;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #E2E8F0;
      border-top-color: #0D9488;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loading-card">
      <div class="logo-badge">
        <span class="medical-icon">✚</span>
      </div>
      <div class="loading-title">GASTRO QUEST</div>
      <div class="loading-subtitle">URGENCE MICI</div>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
