<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Nursing Adventure: Learn, Play & Challenge - The anime-inspired mobile web game for nursing students!">
  <meta name="theme-color" content="#061121">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="Nursing Adventure – Educational Anime Web Game">
  <meta property="og:description" content="Race across the medical board, climb golden clinical ladders, avoid hazard snakes, and master nursing skills!">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nursing Adventure">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nursing Adventure – Anime Educational Board Game</title>
  <link rel="manifest" href="manifest.json">

  <!-- Web Audio Synthesizer -->
  <script src="audio_synth.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #061121;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0B1E38 0%, #061121 100%);
      color: #FFFFFF;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .logo-badge {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00E5FF, #0077B6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.45);
      animation: pulse 1.8s infinite ease-in-out;
      margin-bottom: 24px;
    }
    .medical-cross {
      font-size: 46px;
      line-height: 1;
      color: #FFFFFF;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .loading-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00E5FF, #FFD166, #00E5FF);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      animation: shine 2.5s linear infinite;
      margin-bottom: 8px;
      text-align: center;
    }
    .loading-subtitle {
      font-size: 13px;
      letter-spacing: 3px;
      color: #90E0EF;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00E5FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(0, 229, 255, 0.3); }
      50% { transform: scale(1.08); box-shadow: 0 0 45px rgba(0, 229, 255, 0.65); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-badge">
      <span class="medical-cross">✚</span>
    </div>
    <div class="loading-title">Nursing Adventure</div>
    <div class="loading-subtitle">LEARN • PLAY • CHALLENGE</div>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
