<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <script>
    // Configuration dynamique du base-href pour supporter Cloudflare Pages (/), GitHub Pages (/nursing-adventure/) et serveurs locaux
    (function () {
      var baseEl = document.querySelector('base');
      if (!baseEl) {
        baseEl = document.createElement('base');
        document.head.prepend(baseEl);
      }
      var pathname = window.location.pathname;
      if (pathname.indexOf('/nursing-adventure') === 0) {
        baseEl.setAttribute('href', '/nursing-adventure/');
      } else {
        baseEl.setAttribute('href', '/');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Capsule Warriors : The Stomach Mission - Jeu 2D Arcade Éducatif Médical sur les MICI • ISSIT PFE">
  <meta name="theme-color" content="#0B253C">

  <!-- Open Graph / Partage Réseaux -->
  <meta property="og:title" content="CAPSULE WARRIORS : THE STOMACH MISSION">
  <meta property="og:description" content="Expédition médicale 2D arcade dans le système digestif. Neutralisez les pathogènes et maîtrisez les 27 questions cliniques sur les MICI.">
  <meta property="og:type" content="website">

  <!-- Polices Google Fonts pour affichage instantané -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- iOS PWA tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Capsule Warriors">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CAPSULE WARRIORS : THE STOMACH MISSION</title>
  <link rel="manifest" href="manifest.json">

  <!-- Synthétiseur Web Audio dynamique intégré -->
  <script src="audio_synth.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0B253C;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #164B70 0%, #0B253C 100%);
      color: #FFFFFF;
      z-index: 99999;
      transition: opacity 0.4s ease;
    }
    .loading-card {
      background: rgba(16, 24, 44, 0.85);
      border: 1.5px solid rgba(0, 229, 255, 0.35);
      border-radius: 24px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.2), inset 0 0 20px rgba(0, 102, 255, 0.1);
      max-width: 360px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .capsule-badge {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(0, 102, 255, 0.3));
      border: 1.5px solid #00E5FF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
      animation: pulseGlow 2s infinite ease-in-out;
    }
    .capsule-svg {
      width: 44px;
      height: 44px;
    }
    .loading-title {
      font-family: 'Orbitron', 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: #FFFFFF;
      text-shadow: 0 0 14px rgba(0, 229, 255, 0.7);
      margin-bottom: 4px;
    }
    .loading-subtitle {
      font-family: 'Orbitron', 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: #00E5FF;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .loading-status {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: #94A3B8;
      letter-spacing: 0.8px;
      margin-bottom: 18px;
      min-height: 16px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00E5FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .fallback-btn {
      display: none;
      margin-top: 16px;
      background: linear-gradient(135deg, #00E5FF, #0066FF);
      color: #FFFFFF;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
      50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 229, 255, 0.6); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loading-card">
      <div class="capsule-badge">
        <svg class="capsule-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="capGlow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
              <stop stop-color="#00E5FF"/>
              <stop offset="0.5" stop-color="#0066FF"/>
              <stop offset="1" stop-color="#7C3AED"/>
            </linearGradient>
          </defs>
          <rect x="8" y="18" width="48" height="28" rx="14" fill="url(#capGlow)" stroke="#00E5FF" stroke-width="2.5"/>
          <line x1="32" y1="18" x2="32" y2="46" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3"/>
          <circle cx="20" cy="32" r="5" fill="#FFFFFF"/>
          <path d="M4 32 L10 26 L10 38 Z" fill="#FF9100"/>
        </svg>
      </div>
      <div class="loading-title">CAPSULE WARRIORS</div>
      <div class="loading-subtitle">THE STOMACH MISSION</div>
      <div class="loading-status" id="loading-status">INITIALISATION DE LA CAPSULE...</div>
      <div class="spinner"></div>
      <button class="fallback-btn" id="loading-fallback" onclick="location.reload(true);">Actualiser</button>
    </div>
  </div>

  <script>
    // Événement Flutter peint premier frame
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    });

    // Surveillance watchdog : si le chargement dépasse 7s, informer et proposer un rechargement
    setTimeout(function () {
      const status = document.getElementById('loading-status');
      const fallback = document.getElementById('loading-fallback');
      if (status) status.innerText = 'Connexion établie, finalisation du rendu...';
      if (fallback) fallback.style.display = 'inline-block';
    }, 7000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
